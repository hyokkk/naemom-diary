<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내몸일기</title>
<meta name="theme-color" content="#EDF2F0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111817" media="(prefers-color-scheme: dark)" />
<meta name="description" content="매일의 몸 상태와 식사, 운동, 약을 기록하는 개인 건강 일기" />
<!-- iOS에서 '홈 화면에 추가'하면 주소창 없이 앱처럼 열린다 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="내몸일기" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- 홈 화면 아이콘. 실제 이미지 파일이어야 해서 HTML에 넣지 않고 따로 둔다. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" />
<style>
/* 레이아웃: 휴대폰 기준 한 줄 배치(최대 560px), 위쪽 고정 머리글, 아래쪽 고정 탭 */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --sunk:#E1E9E6; --ink:#1B2826; --muted:#5B6B68; --line:#D1DCD8;
  --accent:#2C6A61; --on-accent:#FFFFFF; --warm:#A85A22; --warm-soft:#F4E5D8; --danger:#B03A2E;
  --c1:#3566B0; --c2:#7B55B8; --c3:#1F8A7A; --c4:#C0601F; --c5:#B2457A; --c6:#6F8424; --c7:#8A6744; --c8:#2F7FA6; --c9:#4B4FA8; --c10:#946B00;
  --lv1:#C2413A; --lv2:#D2691E; --lv3:#D9B03A; --lv4:#7DB867; --lv5:#2E8B57;
  --lv1t:#FFFFFF; --lv2t:#FFFFFF; --lv3t:#2B2410; --lv4t:#13240D; --lv5t:#FFFFFF;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111817; --surface:#19221F; --sunk:#24302D; --ink:#E3ECE9; --muted:#97A8A4; --line:#2C3936;
  --accent:#72B6A9; --on-accent:#0E1D1A; --warm:#E3A06C; --warm-soft:#3A2A1E; --danger:#E7837A;
  --c1:#82A8E8; --c2:#B49BE8; --c3:#5FC6B4; --c4:#EE9A5E; --c5:#E68AB3; --c6:#B4C766; --c7:#CDA982; --c8:#7EC0E0; --c9:#9A9CE8; --c10:#E0BE55;
  --lv1:#E5736B; --lv2:#F0A066; --lv3:#E8CB62; --lv4:#9BD083; --lv5:#5CC089;
  --lv1t:#10201C; --lv2t:#10201C; --lv3t:#10201C; --lv4t:#10201C; --lv5t:#10201C;
  color-scheme: dark }}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
img{max-width:100%}
.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.boot{color:var(--muted);text-align:center;padding:48px 0;font-size:14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:18px 0 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.muted{color:var(--muted)} .small{font-size:12px} .num-t{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sm{font-size:13px;min-height:32px;padding:4px 11px}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.scale .chip{border-radius:8px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:1.25;min-width:0}
.scale .chip b{font-size:17px;font-variant-numeric:tabular-nums}
.scale .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
input[type=text],input[type=number],input[type=password],input[type=date],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
.numin{display:flex;align-items:center;gap:8px;max-width:200px}
.numin input{font-size:20px;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:999px;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.iconbtn.on{border-color:var(--accent);color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.link{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar .mid{text-align:center;min-width:0}
.datebar .d{font-family:var(--f-display);font-weight:700;font-size:20px}
.meal{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center}
.meal + .meal{margin-top:8px}
.meal .lb{font-size:13px;color:var(--muted)}
.thumbwrap{position:relative;width:44px;height:44px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;cursor:zoom-in;border:1px solid var(--line)}
.thumb.ph{background:var(--sunk)}
.thumbwrap .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;line-height:1;cursor:pointer;padding:0}
.photo{position:relative;width:44px;height:44px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.check{display:flex;align-items:center;gap:10px;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.once{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{appearance:none;font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:4px 3px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cell.out{opacity:.38}
.cell.fut{background:transparent}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .n{font-size:12px;font-variant-numeric:tabular-nums;padding-left:2px}
.cell .hd{display:flex;align-items:center;justify-content:space-between;gap:2px;flex-wrap:wrap;min-height:22px}
.tg{display:block;font-size:10px;line-height:1.35;padding:0 3px;border-radius:4px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tg.c{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);font-weight:500}
.tg.c.solid{background:var(--c);color:var(--surface)}
.tg.c.line{background:transparent;border-left:3px solid var(--c);border-radius:0}
.lvc{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.lv1{background:var(--lv1);color:var(--lv1t)} .lv2{background:var(--lv2);color:var(--lv2t)} .lv3{background:var(--lv3);color:var(--lv3t)} .lv4{background:var(--lv4);color:var(--lv4t)} .lv5{background:var(--lv5);color:var(--lv5t)}
.chip.f{display:inline-flex;align-items:center;gap:6px}
.chip.f.on{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dot.ramp{width:22px;border-radius:5px;background:linear-gradient(90deg,var(--lv1),var(--lv3),var(--lv5))}
.legend{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px;font-size:12px}
.lgs{display:flex;flex-wrap:wrap;gap:6px}
.legend .lg{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px 2px 2px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.legend .lvc{width:18px;height:18px;font-size:11px}
.lvpick{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-bottom:14px}
.lvpick button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;min-width:0}
.lvpick button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lvpick .lvc{width:30px;height:30px;font-size:15px}
.lvpick .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvpick small{color:var(--muted);font-variant-numeric:tabular-nums}
.dayrow{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dayrow .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayrow .dh strong{font-family:var(--f-display);font-size:16px}
.sum{display:flex;flex-wrap:wrap;gap:4px}
.sum .tg{display:inline-block;font-size:12px;padding:1px 7px;line-height:1.5}
.dayrow .note{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.toggle button{appearance:none;border:0;background:none;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--accent);color:var(--on-accent)}
.big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.big small{font-size:14px;font-weight:400;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.brow{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:13px}
.brow + .brow{margin-top:6px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .dt{fill:var(--accent)}
.chart .bx{fill:var(--accent)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent);color:var(--on-accent)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.med{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.med:last-of-type{border-bottom:0}
.med .dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.med .dates label,.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form{display:grid;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item.hid .nm{opacity:.55}
.item .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.opts{background:var(--bg);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center}
.opt.hid input{opacity:.5;text-decoration:line-through}
.mini{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
.mini:disabled{opacity:.35;cursor:default}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-family:var(--f-display);font-size:34px;margin:0}
.err{color:var(--danger);font-size:13px;min-height:1em}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.ov img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="shell" id="app"><div class="boot">불러오는 중…</div></div>
<div class="toast" id="toast" hidden></div>
<div class="ov" id="ov" hidden data-act="closeov"></div>
